<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Propuestas de Mejora - ReviewLab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="css/styles.css">
 
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div>
    <h1> Propuestas de Mejora</h1>
    <p>Transforma ideas en mejoras reales dentro de ReviewLab</p>
  </div>
</section>

<!-- CONTENIDO -->
<section class="section">
  <div class="container">

    <!-- FORMULARIO -->
    <div class="card mb-5">
      <div class="card-body">

        <h4 class="mb-4">Nueva Propuesta</h4>

        <div class="mb-3" >
          <label class="form-label" style="color: aliceblue;" >Título</label>
          <input id="titulo" type="text" class="form-control" placeholder="Ej: Mejorar experiencia del login">
        </div>

        <div class="mb-3">
          <label class="form-label" style="color: aliceblue;">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="3" placeholder="Explica la mejora..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label" style="color: aliceblue;">Prioridad</label>
          <select id="prioridad" class="form-control">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <button class="btn btn-main w-100" id="btnEnviar">
           Enviar Propuesta
        </button>

      </div>
    </div>

    <!-- FILTROS -->
    <div class="d-flex flex-wrap gap-2 mb-4 justify-content-center">
      <button class="btn btn-outline-dark btn-sm" data-estado='todas'>Todas</button>
      <button class="btn btn-outline-secondary btn-sm" data-estado="pendiente">Pendientes</button>
      <button class="btn btn-outline-warning btn-sm" data-estado="en_revision">En revisión</button>
      <button class="btn btn-outline-success btn-sm" data-estado="aceptada">Aceptadas</button>
      <button class="btn btn-outline-danger btn-sm" data-estado="rechazada">Rechazadas</button>
    </div>

    <!-- LISTADO -->
    <div id="listaPropuestas" class="row g-4">
      <!-- JS renderiza aquí -->
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 ReviewLab - Sistema de evaluación y mejora continua</p>
</footer>
<script src="./backend/js/mejoras.js"></script>
</body>
</html>
